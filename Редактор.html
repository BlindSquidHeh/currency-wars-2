<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор справочника</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b091a;--panel:#14112b;--panel2:#1b1738;--panel3:#221d46;--line:rgba(196,176,255,.13);--line2:rgba(196,176,255,.26);--text:#efebff;--muted:#a8a1c9;--dim:#716a95;--gold:#e3c27c;--gold2:#b8955a;--hl:#f6aa4c;--ok:#5fd0a0;--bad:#ff7b7b;--violet:#8f72ff;
  --serif:"PT Serif",Georgia,serif;--font:"Manrope",system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;object-fit:contain}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(20,17,43,.95);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font:700 19px var(--serif);color:var(--gold);white-space:nowrap}
.tabs{display:flex;gap:2px;flex:1 1 100%;order:9;flex-wrap:wrap}
header h1{margin-right:auto !important}
.tab{padding:7px 13px;border:0;background:none;border-radius:9px;color:var(--muted);font-weight:700}
.tab:hover{color:var(--text)}.tab.on{background:var(--panel3);color:#fff}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--gold2)}
a.btn{color:var(--text);text-decoration:none}
.btn.main{background:linear-gradient(180deg,#f2d79b,#d2aa5f);color:#1a1206;border-color:var(--gold)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
#status{font-size:12.5px;color:var(--muted);min-width:150px;text-align:right}
#status.dirty{color:var(--hl)}
main{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:0}
aside{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.lhead{display:flex;gap:8px;padding:12px}
.lhead input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;outline:none}
.lfilter{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12px;font-weight:700}
.chip.on{background:var(--panel3);color:#fff;border-color:var(--violet)}
#list{flex:1;overflow:auto;padding:0 8px 12px}
.it{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.it:hover{background:var(--panel)}.it.sel{background:var(--panel2);border-color:var(--line2)}
.it img,.it .ph{width:36px;height:36px;border-radius:8px;background:#0e0a1e;flex:none}
.it b{display:block;font-size:13.5px;line-height:1.25}
.it small{color:var(--dim);font-size:11.5px}
.mark{margin-left:auto;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;white-space:nowrap}
.mark.e{background:rgba(246,170,76,.15);color:var(--hl)}.mark.n{background:rgba(95,208,160,.15);color:var(--ok)}.mark.d{background:rgba(255,123,123,.15);color:var(--bad)}
section#form{overflow:auto;padding:22px 28px 60px;min-height:0}
.empty{color:var(--muted);padding:60px 0;text-align:center}
.fhead{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.drop{position:relative;width:96px;height:96px;flex:none;border-radius:14px;border:1.5px dashed var(--line2);display:grid;place-items:center;background:#0e0a1e;cursor:pointer;overflow:hidden}
.drop img{width:100%;height:100%}
.drop span{position:absolute;bottom:0;left:0;right:0;font-size:10.5px;text-align:center;background:rgba(0,0,0,.6);padding:2px}
.drop.over{border-color:var(--gold)}
.fhead h2{margin:0;font:700 24px var(--serif)}
.fhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px;margin-bottom:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
label.f input,label.f select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;outline:none;font-weight:500;color:var(--text)}
label.f input:focus,textarea:focus,label.f select:focus{border-color:var(--gold2)}
.checks{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-weight:600;color:var(--text);font-size:13.5px}
.checks input{accent-color:var(--gold)}
h3.sec{margin:24px 0 10px;font:800 11.5px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
h3.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold2),transparent)}
.rte{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--panel);margin-bottom:10px}
.tb{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:rgba(255,255,255,.02)}
.tb button{padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:700}
.tb button:hover{border-color:var(--gold2)}
.rte textarea{display:block;width:100%;min-height:90px;border:0;border-radius:0;resize:vertical;font:13px/1.5 ui-monospace,Consolas,monospace}
.pv{padding:10px 12px;border-top:1px dashed var(--line);font-size:14px;color:#ddd8f4}
.pv b.v{color:var(--hl)}.pv a.ref{color:#9ad8ff;border-bottom:1px solid rgba(154,216,255,.35)}
.pv .prop{color:#d9ccff;font-weight:700}
.row{display:grid;grid-template-columns:90px 120px minmax(0,1fr) 34px;gap:10px;align-items:start;padding:10px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--line);margin-bottom:8px}
.row .x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--bad)}
.skill{padding:12px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--line);margin-bottom:10px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tchip img{width:20px;height:20px}
.tchip.on{color:#fff;border-color:var(--gold);background:rgba(227,194,124,.12)}
details{margin-top:24px}
summary{cursor:pointer;color:var(--muted);font-weight:700}
#json{width:100%;min-height:260px;margin-top:10px;font:12.5px/1.45 ui-monospace,Consolas,monospace}
.split{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:24px;align-items:start}
@media (max-width:1300px){.split{grid-template-columns:minmax(0,1fr)}}
.pvw{position:sticky;top:0;height:calc(100vh - 110px);min-height:520px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#05030c}
.pvw iframe{width:100%;height:100%;border:0}
.pvw b{position:absolute;left:10px;top:8px;z-index:2;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);background:rgba(5,3,12,.7);padding:2px 8px;border-radius:6px}
.rwrow{display:grid;grid-template-columns:150px minmax(0,1fr) 70px 46px 96px;gap:8px;align-items:center;padding:8px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--line);margin-bottom:6px}
.rwrow select,.rwrow input{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;outline:none;min-width:0;width:100%}
.rwrow .ops{display:flex;gap:4px}
.rwrow .ops button{width:28px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2)}
.rwrow label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.rwf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.rwf select,.rwf input:not([type=checkbox]){flex:1 1 140px;min-width:0;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;outline:none}
.rwf label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.rwf label input[type=number]{flex:0 0 70px}
.stgrow{display:grid;grid-template-columns:160px minmax(0,1fr) 34px;gap:8px;margin-bottom:6px}
.stgrow input,.stgrow select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;outline:none;min-width:0;color:var(--text)}
.stgrow input[type=color]{padding:0;height:32px}
.stgrow button{border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--bad)}
.cardmode{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#spineFrame{width:100%;height:100%;border:0;display:none}
#siteEdit{width:100%;height:100%;border:0;display:none;background:var(--bg)}
#edp{position:fixed;right:14px;bottom:14px;width:min(560px,92vw);max-height:62vh;overflow:auto;background:var(--panel2);border:1px solid var(--gold2);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.6);padding:12px 14px;z-index:60;display:none}
#edp.show{display:block}
#siteBar{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
#siteBar.show{display:flex}
#siteBar .sp{flex:1}
select{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:6px 8px}
#edp select,#edp input,#edp textarea{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;max-width:100%}
#siteBar select{max-width:230px;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:7px 10px}
select option{background:var(--panel);color:var(--text)}
#form.drawer{position:fixed;right:0;top:0;bottom:0;width:min(760px,100vw);z-index:70;overflow:auto;background:var(--bg);border-left:1px solid var(--gold2);padding:46px 16px 24px;box-shadow:-18px 0 50px rgba(0,0,0,.6);display:block}
#drBar{position:fixed;right:14px;top:8px;z-index:80;display:none}
#drBar.show{display:block}
main.siteMode{grid-template-rows:auto minmax(0,1fr)}
#edp h4{margin:0 0 4px;font-size:14px;color:var(--gold)}
#edp .where{color:var(--dim);font-size:12px;margin-bottom:8px;word-break:break-all}
#edp .x{float:right}
#log{position:fixed;right:18px;bottom:18px;width:min(520px,90vw);max-height:40vh;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;display:none;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#log.show{display:block}
#log .close{float:right;border:0;background:none;color:var(--muted)}
.hint{color:var(--dim);font-size:12px;margin:-4px 0 10px}
.hint select,.skill select,.skill input{background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--text);padding:3px 6px}
.offline{padding:40px;max-width:640px;margin:40px auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px}
.offline code{background:#0e0a1e;padding:2px 6px;border-radius:6px}
.sx-obj{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:6px 0}
.sx-obj>label.wide{grid-column:1/-1}
.sx-obj input:not([type=checkbox]){width:100%}
.sx-arr{display:flex;flex-direction:column;gap:8px;padding:8px;border:1px dashed var(--line2);border-radius:12px}
.sx-it{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:start;padding:8px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.sx-it>.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--bad);cursor:pointer}
.sx-arr>.btn{align-self:flex-start}
.sx-img{display:flex;gap:8px;align-items:center}.sx-img img,.sx-img .ph{width:48px;height:48px;border-radius:8px;background:#0e0a1e;object-fit:contain;flex:none}
.sx-img input{flex:1;min-width:0}
#lfilter select{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;color:var(--text)}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.th-c{display:flex;gap:6px;align-items:center}.th-c input[type=color]{width:56px;height:34px;padding:0;border:1px solid var(--line2);border-radius:8px;background:none}
.th-xc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.th-xc>b{min-width:160px}.th-xc input[type=color]{width:40px;height:32px;padding:0;border:1px solid var(--line2);border-radius:8px;background:none}
.th-prev{width:60px;height:40px;border-radius:8px;border:1px solid var(--line2)}
.th-pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.th-pic{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
.th-pic img,.th-pic .ph{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#0e0a1e;flex:none}
.th-pic small{display:block;color:var(--muted);margin-bottom:6px}.th-b{display:flex;gap:6px;flex-wrap:wrap}
.th-tpl{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}.th-tpl small{color:var(--dim);flex:1}
.cardmode select{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;color:var(--text)}
</style>
</head>
<body>
<header>
  <h1>Редактор справочника</h1>
  <div class="tabs" id="tabs"></div>
  <span id="status">Загрузка…</span>
  <button class="btn" id="bUndo" title="Отменить последнее изменение (Ctrl+Z)" disabled>↶</button><button class="btn" id="bRedo" title="Вернуть (Ctrl+Y)" disabled>↷</button>
  <button class="btn" id="bSave">Сохранить</button>
  <button class="btn main" id="bBuild">Сохранить и собрать сайт</button>
  <button class="btn" id="bPub" title="Выложить сайт в интернет (только просмотр)">Опубликовать…</button>
  <a class="btn" href="index.html" target="_blank" style="text-decoration:none">Открыть сайт ↗</a>
</header>
<main>
  <aside>
    <div class="lhead"><input id="q" placeholder="Поиск…"><button class="btn" id="bAdd" title="Добавить новую запись">＋</button></div>
    <div class="lfilter" id="lfilter"></div>
    <div id="list"></div>
  </aside>
  <section id="form"><div class="empty">Выберите запись слева или добавьте новую.</div></section>
</main>
<div id="edp"></div>
<div id="drBar"><button class="btn main" id="drClose">✕ Закрыть карточку</button></div>
<iframe id="site" title="сайт" style="position:absolute;width:10px;height:10px;left:-9999px;top:0;border:0"></iframe>
<dialog id="pubDlg" style="background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:18px;max-width:560px">
  <h3 style="margin:0 0 8px">Публикация на GitHub Pages</h3>
  <p class="hint" style="margin:0 0 12px">Посетители видят только сайт; редактор остаётся на этом компьютере. Токен хранится в build/publish.json и никуда, кроме GitHub, не отправляется.</p>
  <label class="f">Адрес репозитория<input id="pubRepo" placeholder="https://github.com/ник/valutki"></label>
  <label class="f" style="margin-top:10px">Токен GitHub (fine-grained, право Contents: Read and write)<input id="pubTok" type="password" placeholder="оставьте пустым, если уже сохранён"></label>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="pubCancel">Отмена</button><button class="btn main" id="pubGo">Собрать и опубликовать</button></div>
</dialog>
<div id="log"><button class="close" onclick="this.parentNode.classList.remove('show')">✕</button><div id="logt"></div></div>
<script src="patch.js"></script>
<script src="designer.js"></script>
<script src="sections.js"></script>
<script src="theme.js"></script>
<script src="extras.js"></script>
<script>
(() => {
'use strict';
// Редактор хранит правки в build/overrides.json: изменённые и новые записи целиком + список удалённых id.
// Сборка (make_site.py) накладывает их поверх данных игры, поэтому исходные данные не портятся.
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

const KINDS = {
  site:     {t:'✎ Править на сайте'},
  roles:    {t:'Персонажи', icon:x => 'avs/' + x.avatar, sub:x => `Стоимость ${x.cost} · ${POS[x.pos] || x.pos}`},
  traits:   {t:'Связи', icon:x => x.icon || 'trait/' + x.id, sub:x => KIND[x.kind] + ' · ' + (x.layers || []).map(l => l.n).join('/')},
  items:    {t:'Экипировка и предметы', icon:x => x.icon, sub:x => CAT[x.cat] || x.cat},
  augments: {t:'Стратегии', icon:x => x.icon, sub:x => QNAME[x.q] + (x.new ? ' · 2 сезон' : '') + (x.old ? ' · устар.' : '')},
  buffs:    {t:'Среды', icon:x => x.icon, sub:x => (x.new ? '2 сезон' : '1 сезон') + (x.old ? ' · устар.' : '')},
  bank:     {t:'База данных'},
  theme:    {t:'Оформление'},
  blocks:   {t:'Блоки и надписи'},
  spine:    {t:'Анимации'},
};
const POS = {front:'На поле', back:'Вне поля', flex:'Универсал'};
const KIND = {origin:'Фракция', class:'Роль', unique:'Уникальная', special:'Особая'};
const QNAME = {Silver:'Серебро', Gold:'Золото', Prismatic:'Призма'};
const QL = {None:'Бронза', Silver:'Серебро', Gold:'Золото', Multicolor:'Призма'};
const CAT = {basic:'Простая', advanced:'Продвинутая', privilege:'Особая', emblem:'Эмблема', mod:'Модуль взлома', food:'Блюдо', trailblaze:'Товар Освоения', material:'Материал', trash:'Хлам', crown:'Корона', consumable:'Расходник', forge:'Кузница', armor:'Броня (мод)'};
const SIDE = {front:'На поле', back:'Вне поля', servant:'Призыв'};
const STYPE = ['Skill', 'Ultimate', 'Talent', 'Basic ATK', 'Elation Skill', 'Memosprite Skill', 'Memosprite Talent'];

let CLIPS = {roles:{}, traits:{}}, clipsDirty = false;
let BASE = null, OVR = {edit:{}, deleted:{}, sections:{}, theme:{}, templates:{}, blocks:[], texts:[]}, IMG = {}, NEWIMG = {}, SECB = {}, secPath = 'bank.armor';
let OVR_V = '';
let kind = 'site', selId = null, dirty = false, lf = '';

function status(t, d) { const s = $('#status'); s.textContent = t; s.classList.toggle('dirty', !!d); }
function setDirty() { dirty = true; status('Есть несохранённые правки', true); }
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// ---------- данные ----------
const base = (k, id) => BASE[k].find(x => x.id === id);
const edited = (k, id) => (OVR.edit[k] || {})[id];
const isDel = (k, id) => (OVR.deleted[k] || []).includes(id);
const cur = (k, id) => edited(k, id) || base(k, id);
function allOf(k) {
  const L = BASE[k].map(x => edited(k, x.id) || x);
  for (const o of Object.values(OVR.edit[k] || {})) if (!base(k, o.id)) L.push(o);
  return L;
}
function put(k, obj) { snap(); (OVR.edit[k] = OVR.edit[k] || {})[obj.id] = obj; setDirty(); siteSync(k, obj); }
// история: снимок правок перед изменением; быстрые подряд изменения (набор текста) объединяются в один шаг
const HIST = [], FUT = []; let snapT = 0, lastSnap = '';
function snap() {
  const now = Date.now(), cur = JSON.stringify(OVR);
  if (now - snapT > 700 && cur !== lastSnap) { HIST.push(cur); if (HIST.length > 200) HIST.shift(); FUT.length = 0; }
  snapT = now; lastSnap = cur; histBtns();
}
function histBtns() { $('#bUndo').disabled = !HIST.length; $('#bRedo').disabled = !FUT.length; }

function cleanHtml(h) {
  // стиль оставляем только у наших span.fx (размер, шрифт, цвет…), остальной мусор браузера убираем
  return h.replace(/<div><br><\/div>/g, '<br>').replace(/<div>/g, '<br>').replace(/<\/div>/g, '')
    .replace(/<([a-z0-9]+)\b([^>]*)>/gi, (m, tg, at) => /class="(fx|ii)"/.test(at) ? m : m.replace(/ style="[^"]*"/g, ''))
    .replace(/&nbsp;/g, ' ').replace(/^<br>/, '').replace(/<span>([^<]*)<\/span>/g, '$1');
}

  $$('[data-k]', F).forEach(el => el.oninput = el.onchange = () => {

  // картинка
  const drop = $('#drop'), file = $('#file');
  drop.onclick = () => file.click();

  file.onchange = () => file.files[0] && setImage(file.files[0]);
  function setImage(f) {
    const r = new FileReader();
    r.onload = async () => {
      const url = await toPng(r.result);
      const keys = kind === 'roles' ? ['av/' + x.avatar, 'avs/' + x.avatar] : [iconKey];
      for (const k of keys) { NEWIMG[k] = url; await fetch('/api/upload?key=' + encodeURIComponent(k.replace('/', '__')), {method:'POST', body:url}); }
      if (kind !== 'roles' && !x.icon) { x.icon = iconKey; commit(); }
      status('Картинка загружена — соберите сайт, чтобы увидеть её там', true); renderForm(); renderList();
    };
    r.readAsDataURL(f);
  }
}
const toPng = src => new Promise(res => { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'); c.width = i.width; c.height = i.height; c.getContext('2d').drawImage(i, 0, 0); res(c.toDataURL('image/png')); }; i.src = src; });

// рекомендуемая экипировка: x.rec = {front|back: {first:[id], second:[id]}}; на сайте показываются first + second
function recEditor(x, commit) {
  const W = document.createElement('div');
  const EQ = allOf('items').filter(i => i.type === 'Equipment' && !i.old && !isDel('items', i.id)).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  const byId = Object.fromEntries(EQ.map(i => [i.id, i]));
  const ROW = {first:'Основная', second:'Дополнительная'};
  const draw = () => {
    W.innerHTML = ''; W.append(sec('Рекомендуемая экипировка'));
    const rec = x.rec || {};
    const sides = [...new Set([...Object.keys(rec), ...Object.keys(x.skills || {}).filter(s => s !== 'servant')])];
    for (const side of sides.length ? sides : ['front']) {
      const R = rec[side] || {};
      const own = () => { x.rec = x.rec || {}; x.rec[side] = x.rec[side] || {}; return x.rec[side]; };
      for (const row of Object.keys(ROW)) {
        const L = R[row] || [];
        const line = document.createElement('div'); line.style.cssText = 'display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px;align-items:start;margin:8px 0';
        line.innerHTML = `<span class="hint" style="padding-top:6px">${SIDE[side]} · ${ROW[row]}</span><div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0">` + L.map((id, i) => { const it = byId[id];
          return `<span class="tchip on" data-i="${i}" title="Убрать">${it && img(it.icon) ? `<img src="${img(it.icon)}" alt="">` : ''}${esc(it ? it.name : 'нет предмета ' + id)} ✕</span>`; }).join('')
          + `<select style="width:auto;max-width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:4px 8px"><option value="">＋ Добавить предмет…</option>${EQ.map(i => `<option value="${i.id}">${esc(i.name)}${CAT[i.cat] ? ' · ' + CAT[i.cat] : ''}</option>`).join('')}</select></div>`;
        line.onclick = e => { const c = e.target.closest('.tchip'); if (!c) return; own()[row].splice(+c.dataset.i, 1); commit(); draw(); };
        $('select', line).onchange = e => { if (e.target.value) { const o = own(); (o[row] = o[row] || []).push(+e.target.value); commit(); draw(); } };
        W.append(line);
      }
    }
  };
  draw();
  return W;
}

// навыки персонажа: свои иконки, добавить / удалить / переставить, текст по звёздам; эйдолоны
function skillsEditor(x, commit) {
  const W = document.createElement('div');
  const siteRole = (() => { try { return SITE.CW_API.role(x.id); } catch (e) { return null; } })();
  const draw = () => {
    W.innerHTML = '';
    x.skills = x.skills || {}; x.one = x.one || {};
    for (const side of Object.keys(SIDE)) {
      if (!x.skills[side]) continue;
      W.append(sec('Кратко · ' + SIDE[side]), rte((x.one[side] || {}).html, v => { x.one[side] = {html:v}; commit(); }, 2));
      W.append(sec('Навыки · ' + SIDE[side]));
      x.skills[side].forEach((s, i) => {
        const b = document.createElement('div'); b.className = 'skill';
        const gameIcon = siteRole && siteRole.skills && siteRole.skills[side] && siteRole.skills[side][i] ? siteRole.skills[side][i].icon : '';
        b.innerHTML = `<div class="grid" style="margin-bottom:8px;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto">${field('Название навыка', `<input data-s="name" value="${esc(s.name)}">`)}
          ${field('Тип', `<select data-s="type">${STYPE.map(t => `<option${s.type === t ? ' selected' : ''}>${t}</option>`).join('')}</select>`)}
          ${field('Метка (необязательно)', `<input data-s="tag" value="${esc(s.tag || '')}" placeholder="например: Одиночная цель">`)}
          <div style="display:flex;gap:6px;align-items:end"><button class="btn" data-a="up" title="Выше">↑</button><button class="btn" data-a="down" title="Ниже">↓</button><button class="btn danger" data-a="del">Удалить навык</button></div></div>`;
        b.append(CW_THEME.pic(s.iconOwn ? 'Своя иконка навыка' : 'Иконка навыка (из игры; загрузите свою)', s.iconOwn || gameIcon, `skill/${x.id}_${side}_${i}_${Date.now() % 100000}`, k => { if (k) s.iconOwn = k; else delete s.iconOwn; commit(); draw(); }));
        b.oninput = b.onchange = e => { const k = e.target.dataset.s; if (!k) return; if (e.target.value) s[k] = e.target.value; else delete s[k]; commit(); };
        b.onclick = e => {
          const a = e.target.dataset.a; if (!a) return;
          const L = x.skills[side];
          if (a === 'del' && confirm(`Удалить навык «${s.name}»?`)) L.splice(i, 1);
          if (a === 'up' && i) L.splice(i - 1, 0, L.splice(i, 1)[0]);
          if (a === 'down' && i < L.length - 1) L.splice(i + 1, 0, L.splice(i, 1)[0]);
          if (a === 'addpart') s.desc.push({html:''});
          if (a.startsWith('delpart')) s.desc.splice(+a.slice(7), 1);
          commit(); draw();
        };
        s.desc = s.desc || [{html:''}];
        s.desc.forEach((d, k) => {
          const h = document.createElement('div'); h.className = 'hint'; h.style.cssText = 'display:flex;gap:8px;align-items:center;margin:8px 0 4px';
          h.innerHTML = `<span>${s.desc.length > 1 ? 'Часть ' + (k + 1) : 'Описание'}</span><select title="Для какой звёздности этот текст"><option value="">для всех звёзд</option>${[1, 2, 3, 4].map(n => `<option value="${n}"${d.star === n ? ' selected' : ''}>только ${n}★</option>`).join('')}</select>${s.desc.length > 1 ? `<button class="btn danger" data-a="delpart${k}" style="padding:2px 8px">✕</button>` : ''}`;
          h.querySelector('select').onchange = e => { if (e.target.value) d.star = +e.target.value; else delete d.star; commit(); };
          b.append(h, rte(d.html, v => { d.html = v; commit(); }, 3));
        });
        const ap = document.createElement('button'); ap.className = 'btn'; ap.dataset.a = 'addpart'; ap.textContent = '＋ Часть текста (например, для другой звёздности)'; ap.style.marginTop = '6px'; b.append(ap);
        W.append(b);
      });
      const add = document.createElement('button'); add.className = 'btn'; add.textContent = '＋ Навык · ' + SIDE[side];
      add.onclick = () => { x.skills[side].push({id:'custom' + Date.now(), name:'Новый навык', type:'Skill', desc:[{html:''}]}); commit(); draw(); };
      W.append(add);
    }
    const missing = Object.keys(SIDE).filter(k => !x.skills[k]);
    if (missing.length) {
      const row = document.createElement('div'); row.style.marginTop = '12px';

      row.firstChild.onchange = e => { const k = e.target.value; if (!k) return; x.skills[k] = [{id:'custom' + Date.now(), name:'Новый навык', type:'Skill', desc:[{html:''}]}]; commit(); draw(); };
      W.append(row);
    }
    W.append(sec('Эйдолоны'));
    x.ranks = x.ranks || [];
    x.ranks.forEach((rk, i) => {
      const b = document.createElement('div'); b.className = 'skill';
      b.innerHTML = `<div class="grid" style="margin-bottom:8px;grid-template-columns:90px minmax(0,1fr) auto">${field('Номер', `<input data-r="r" type="number" min="1" value="${rk.r}">`)}${field('Название', `<input data-r="name" value="${esc(rk.name || '')}">`)}<div style="display:flex;align-items:end"><button class="btn danger">Удалить</button></div></div>`;
      b.oninput = e => { const k = e.target.dataset.r; if (k) { rk[k] = k === 'r' ? +e.target.value : e.target.value; commit(); } };
      b.querySelector('button').onclick = () => { if (confirm('Удалить эйдолон?')) { x.ranks.splice(i, 1); commit(); draw(); } };
      b.append(CW_THEME.pic(rk.iconOwn ? 'Своя иконка' : 'Иконка эйдолона', rk.iconOwn || rk.icon, `rank/${x.id}_${i}_${Date.now() % 100000}`, k => { if (k) rk.iconOwn = k; else delete rk.iconOwn; commit(); draw(); }));
      b.append(rte(rk.html, v => { rk.html = v; commit(); }, 2));
      W.append(b);
    });
    const ar = document.createElement('button'); ar.className = 'btn'; ar.textContent = '＋ Эйдолон';
    ar.onclick = () => { x.ranks.push({r:x.ranks.length + 1, name:'Новый эйдолон', html:''}); commit(); draw(); };
    W.append(ar);
  };
  draw();
  return W;
}

// ---------- карточка стратегии / среды: описание, плашки, награды, превью ----------
const RW_TYPES = {role:'Персонаж', item:'Предмет', emblem:'Эмблема связи', trait:'Персонаж связи (?)', coin:'Золотые монеты', gi:'Значок игры', hex:'Стратегия (качество)', remblem:'Случайные эмблемы', chim:'Компаньон', arrow:'Стрелка »', or:'Текст-разделитель'};
const GI_KEYS = {exp:'Опыт', refresh:'Бесплатные обновления', hp:'Восстановление НР', expert:'Приглашение эксперта', wbox1:'Ящик простой', wbox2:'Ящик продвинутый', wbox3:'Ящик особый', rbox1:'Персонаж ст. 1', rbox2:'Персонаж ст. 2', rbox3:'Персонаж ст. 3', rbox4:'Персонаж ст. 4', rbox5:'Персонаж ст. 5', orb:'Сфера', star:'Книга звёзд'};
function rwFields(d, onChange) {
  const r = document.createElement('div'); r.className = 'rwf';
  const traitsAll = () => [...allOf('traits'), ...((SITE && SITE.CW_API) ? SITE.CW_API.oldTraits() : []).map(t => ({...t, name:t.name + ' (1 сезон)'}))];
  const opts = (L, v) => L.map(o => `<option value="${o.id}"${+v === o.id ? ' selected' : ''}>${esc(o.name)}</option>`).join('');
  const draw = () => {
    let what = '';
    if (d.t === 'role') what = `<select data-f="id">${opts(allOf('roles').filter(y => ![151112, 151122, 151132].includes(y.id)).sort((a, b) => a.name.localeCompare(b.name, 'ru')), d.id)}</select>`;
    else if (d.t === 'item') what = `<select data-f="id">${opts(allOf('items').sort((a, b) => a.name.localeCompare(b.name, 'ru')), d.id)}</select>`;
    else if (d.t === 'emblem' || d.t === 'trait') what = `<select data-f="id">${opts(traitsAll(), d.id)}</select>`;
    else if (d.t === 'gi') what = `<select data-f="k">${Object.entries(GI_KEYS).map(([k, v]) => `<option value="${k}"${d.k === k ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
    else if (d.t === 'hex') what = `<select data-f="q">${Object.entries(QNAME).map(([k, v]) => `<option value="${k}"${d.q === k ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
    else if (d.t === 'chim') what = `<select data-f="i">${Array.from({length:12}, (_, k) => `<option value="${k + 1}"${+d.i === k + 1 ? ' selected' : ''}>Компаньон ${k + 1}</option>`).join('')}</select>`;
    else if (d.t === 'or') what = `<input data-f="s" value="${esc(d.s || '')}" placeholder="или / один из: / +">`;
    const hasN = !['arrow', 'or'].includes(d.t), hasQ = ['gi', 'chim', 'trait'].includes(d.t);
    r.innerHTML = `<select data-f="t">${Object.entries(RW_TYPES).map(([k, v]) => `<option value="${k}"${d.t === k ? ' selected' : ''}>${v}</option>`).join('')}</select>${what}
      ${hasN ? `<label>Количество <input data-f="n" type="number" min="1" value="${d.n || 1}" style="width:70px"></label>` : ''}${hasQ ? `<label><input data-f="q" type="checkbox"${d.q ? ' checked' : ''}> случайное (?)</label>` : ''}`;
  };
  r.onchange = r.oninput = e => {
    const f = e.target.dataset.f; if (!f) return;
    if (f === 't') { for (const k in d) delete d[k]; d.t = e.target.value; draw(); return onChange(); }
    if (f === 'q' && e.target.type === 'checkbox') { if (e.target.checked) d.q = '?'; else delete d.q; }
    else if (f === 'id' || f === 'n' || f === 'i') d[f] = +e.target.value; else d[f] = e.target.value;
    if (f === 'n' && d.n <= 1) delete d.n;
    onChange();
  };
  draw();
  return r;
}
function cardEditor(x, M, commit) {

  let pready = false, ptimer = 0;

  const drawDs = () => {
    const has = !!(x.layout && x.layout.items);
    ds.innerHTML = `<span class="hint" style="margin:0">${has ? `Своя раскладка: ${x.layout.items.length} элементов. Плашки и награды ниже не используются.` : 'Расставьте всё как хотите: свои фото, текст, награды, плашки, подложки.'}</span>
      <button class="btn main" data-d="open">${has ? 'Редактировать раскладку' : 'Открыть конструктор'}</button>${has ? '<button class="btn danger" data-d="off">Убрать раскладку</button><button class="btn" data-d="tsave">Сохранить как шаблон</button>' : ''}
      ${Object.keys(OVR.templates || {}).length ? `<select data-d="tpick"><option value="">Применить шаблон…</option>${Object.keys(OVR.templates).map(n => `<option>${esc(n)}</option>`).join('')}</select><button class="btn" data-d="tbulk">Шаблон для многих…</button>` : ''}`;
  };
  ds.onchange = e => {
    if (e.target.dataset.d !== 'tpick' || !e.target.value) return;
    x.layout = clone(OVR.templates[e.target.value]); save(); drawDs();
  };
  ds.onclick = e => {
    const d = (e.target.closest('button') || {}).dataset?.d; if (!d) return;
    if (d === 'tsave') { const n = prompt('Название шаблона:', x.name); if (!n) return; snap(); OVR.templates = OVR.templates || {}; OVR.templates[n] = clone(x.layout); setDirty(); drawDs(); status('Шаблон «' + n + '» сохранён', true); return; }
    if (d === 'tbulk') { bulkTemplate(); return; }
    if (d === 'off') { if (!confirm('Убрать свою раскладку и вернуть обычную карточку?')) return; delete x.layout; save(); drawDs(); return; }
    if (!SITE || !SITE.CW_API) return alert('Сайт ещё загружается, подождите пару секунд');
    CWDesigner.open({kind, obj:clone(x), site:SITE, newImg:NEWIMG, rwFields,
      upload: async (key, png) => { NEWIMG[key] = png; await fetch('/api/upload?key=' + encodeURIComponent(key.replace('/', '__')), {method:'POST', body:png}); },
      onDone: layout => { x.layout = layout; save(); drawDs(); }});
  };
  drawDs();
  L.append(sec('Плашки и награды в карточке'));
  const mode = document.createElement('div'); mode.className = 'cardmode'; L.append(mode);
  const box = document.createElement('div'); L.append(box);
  const manual = () => !!(x.card && (x.card.stages || x.card.rewards));
  const auto = () => (SITE && SITE.CW_API && SITE.CW_API.autoFor) ? SITE.CW_API.autoFor(kind, clone(x)) : {stages:[], rewards:[]};
  const drawMode = () => {
    mode.innerHTML = manual()
      ? `<span class="hint" style="margin:0">Свои плашки и награды.</span><button class="btn" data-m="auto">Вернуть автоматические</button>`
      : `<span class="hint" style="margin:0">Сейчас собираются автоматически из текста.</span><button class="btn" data-m="man">Настроить вручную</button>`;
  };
  mode.onclick = e => {
    const m = (e.target.closest('button') || {}).dataset?.m; if (!m) return;
    if (m === 'man') { const a = auto(); x.card = Object.assign(x.card || {}, {stages:a.stages, rewards:a.rewards}); }
    else { delete x.card.stages; delete x.card.rewards; if (!x.card.text) delete x.card; }
    save(); drawMode(); draw();
  };
  function draw() {
    box.innerHTML = '';
    if (!manual()) {
      const a = auto();
      box.innerHTML = `<div class="hint">Плашки: ${a.stages.map(s => esc(s.join(': '))).join(' · ') || 'нет'}. Наград найдено: ${a.rewards.filter(r => !['arrow', 'or'].includes(r.t)).length}.</div>`;
      return;
    }
    const c = x.card;
    // плашки
    const sh = document.createElement('div'); sh.className = 'hint'; sh.textContent = 'Плашки (подпись и значение, например «Когда» — «Начало партии»):'; box.append(sh);
    c.stages = c.stages || [];
    c.stages.forEach((st, i) => {
      const r = document.createElement('div'); r.className = 'stgrow';
      r.innerHTML = `<input value="${esc(st[0])}" placeholder="Когда"><input value="${esc(st[1])}" placeholder="Начало партии"><button title="Удалить">✕</button>`;
      const [a, b] = r.querySelectorAll('input');
      a.oninput = () => { st[0] = a.value; save(); }; b.oninput = () => { st[1] = b.value; save(); };
      r.querySelector('button').onclick = () => { c.stages.splice(i, 1); save(); draw(); };
      box.append(r);
    });
    const as = document.createElement('button'); as.className = 'btn'; as.textContent = '＋ Плашка'; as.style.marginBottom = '14px';
    as.onclick = () => { c.stages.push(['Когда', '']); save(); draw(); }; box.append(as);
    // награды
    const rh = document.createElement('div'); rh.className = 'hint'; rh.textContent = 'Награды по порядку (тип · что именно · количество · «?» = случайное):'; box.append(rh);
    c.rewards = c.rewards || [];
    c.rewards.forEach((d, i) => {
      const r = document.createElement('div'); r.className = 'rwrow';
      r.style.gridTemplateColumns = 'minmax(0,1fr) 96px';
      r.append(rwFields(d, save));
      const ops = document.createElement('div'); ops.className = 'ops';
      ops.innerHTML = '<button data-o="up" title="Выше">↑</button><button data-o="down" title="Ниже">↓</button><button data-o="del" title="Удалить" style="color:var(--bad)">✕</button>';
      r.append(ops);
      r.querySelector('.ops').onclick = e => {
        const o = (e.target.closest('button') || {}).dataset?.o; if (!o) return;
        if (o === 'del') c.rewards.splice(i, 1);
        if (o === 'up' && i > 0) [c.rewards[i - 1], c.rewards[i]] = [c.rewards[i], c.rewards[i - 1]];
        if (o === 'down' && i < c.rewards.length - 1) [c.rewards[i + 1], c.rewards[i]] = [c.rewards[i], c.rewards[i + 1]];
        save(); draw();
      };
      box.append(r);
    });
    const ar = document.createElement('button'); ar.className = 'btn'; ar.textContent = '＋ Награда';
    ar.onclick = () => { c.rewards.push({t:'coin', n:1}); save(); draw(); }; box.append(ar);
  }
  drawMode(); draw();
  L.append(sec('Подробное описание (блок под наградами)'));
  L.append(Object.assign(document.createElement('p'), {className:'hint', textContent:'Необязательно. Сюда можно расписать, как работает эффект, советы и примеры — блок появится внизу большой карточки.'}));
  L.append(rte(x.card && x.card.text, v => { if (v) { x.card = x.card || {}; x.card.text = v; } else if (x.card) { delete x.card.text; if (!manual()) delete x.card; } save(); }, 4));
}

// применить шаблон раскладки сразу к нескольким стратегиям/средам
function bulkTemplate() {
  const names = Object.keys(OVR.templates || {}); if (!names.length) return;
  const n = prompt('Какой шаблон применить?\n' + names.map((t, i) => `${i + 1}. ${t}`).join('\n'), '1'); if (!n) return;
  const name = names[+n - 1] || names.find(t => t === n); if (!name) return alert('Нет такого шаблона');
  const scope = prompt('К каким записям? Напишите одно:\nвсе — все записи этой вкладки\nSilver / Gold / Prismatic — стратегии этого качества\nили часть названия', 'все'); if (!scope) return;
  const q = scope.trim().toLowerCase();
  const L = allOf(kind).filter(x => q === 'все' || (kind === 'augments' && x.q && x.q.toLowerCase() === q) || x.name.toLowerCase().includes(q));
  if (!L.length) return alert('Ничего не нашлось');
  if (!confirm(`Применить шаблон «${name}» к ${L.length} записям? Свои раскладки у них будут заменены.`)) return;
  snap(); snapT = 0;
  for (const x of L) { const y = clone(x); y.layout = clone(OVR.templates[name]); (OVR.edit[kind] = OVR.edit[kind] || {})[y.id] = y; }
  setDirty(); renderList(); if (selId) renderForm(); status(`Шаблон применён к ${L.length} записям`, true);
}

// ---------- онлайн-режим (редактор открыт на GitHub Pages) ----------
// Вход — токен GitHub с правом записи в репозиторий сайта. Правки сохраняются в online.json репозитория
// (разница с опубликованным состоянием); сайт накладывает их сразу, а домашняя публикация переносит их в overrides.json.
let ORIG = null, GH = null;
const gh = async (path, opt = {}) => fetch('https://api.github.com/repos/' + GH.repo + path, {...opt, cache:'no-store', headers:{Authorization:'Bearer ' + GH.token, Accept:'application/vnd.github+json'}});
const b64 = s => { const u = new TextEncoder().encode(s); let t = ''; for (let i = 0; i < u.length; i += 0x8000) t += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(t); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
async function onlineLoad() {
  GH = {repo: location.hostname.split('.')[0] + '/' + location.pathname.split('/')[1], token: ''};
  try { GH.token = localStorage.getItem('cw_gh_token') || ''; } catch (e) {}
  for (;;) {
    if (!GH.token) GH.token = (prompt('Вход в редактор.\nВставьте токен GitHub с доступом к репозиторию ' + GH.repo + ' (Contents: Read and write).') || '').trim();
    if (!GH.token) { $('main').innerHTML = '<div class="offline"><h2>Нужен вход</h2><p>Обновите страницу и вставьте токен GitHub.</p></div>'; status('Нет входа'); return false; }
    const r = await gh('');
    const j = r.ok ? await r.json() : {};
    if (j.permissions && j.permissions.push) break;
    alert(r.ok ? 'У этого токена нет права записи в репозиторий.' : 'Токен не подошёл.');
    GH.token = '';
  }
  try { localStorage.setItem('cw_gh_token', GH.token); } catch (e) {}
  ORIG = clone(OVR);
  const r = await gh('/contents/online.json');
  if (r.ok) { const f = await r.json(); GH.sha = f.sha; onlineApply(JSON.parse(unb64(f.content) || '{}')); }
  // всё, что требует файлов на домашнем компьютере, онлайн недоступно
  const F = window.fetch;
  window.fetch = (u, o) => /^\/(api|save-)/.test(String(u)) ? (status('Это доступно только дома (картинки, видео, анимации, сборка)', true), Promise.resolve(new Response('', {status:403}))) : F(u, o);
  $('#bBuild').textContent = 'Сохранить на сайт';
  $('#bPub').textContent = 'Сменить токен'; $('#bPub').title = 'Выйти и вставить другой токен GitHub';
  $('#bPub').onclick = () => { try { localStorage.removeItem('cw_gh_token'); } catch (e) {} location.reload(); };
  $('#bSave').onclick = save;
  return true;
}
function onlineApply(O) {
  const P = CW_PATCH;
  for (const k in O.edit || {}) for (const id in O.edit[k]) (OVR.edit[k] = OVR.edit[k] || {})[id] = P.merge(cur(k, +id) || cur(k, id), O.edit[k][id]);
  for (const p in O.sections || {}) OVR.sections[p] = P.merge(p in OVR.sections ? OVR.sections[p] : SECB[p], O.sections[p]);
  if (O.styles) OVR.styles = Object.assign({}, OVR.styles || {}, O.styles);
  for (const k in O.deleted || {}) OVR.deleted[k] = [...new Set([...(OVR.deleted[k] || []), ...O.deleted[k]])];
}
async function onlineSave() {
  const P = CW_PATCH, O = {edit:{}, sections:{}, deleted:{}};
  const was = (k, id) => ((ORIG.edit[k] || {})[id]) || base(k, +id) || base(k, id);
  for (const k of new Set([...Object.keys(OVR.edit), ...Object.keys(ORIG.edit)]))
    for (const id of new Set([...Object.keys(OVR.edit[k] || {}), ...Object.keys(ORIG.edit[k] || {})])) {
      const d = P.diff(was(k, id), (OVR.edit[k] || {})[id] || base(k, +id) || base(k, id));
      if (d) (O.edit[k] = O.edit[k] || {})[id] = d;
    }
  for (const p of new Set([...Object.keys(OVR.sections || {}), ...Object.keys(ORIG.sections || {})])) {
    const d = P.diff(p in ORIG.sections ? ORIG.sections[p] : SECB[p], p in OVR.sections ? OVR.sections[p] : SECB[p]);
    if (d) O.sections[p] = d;
  }
  for (const k in OVR.deleted) { const n = OVR.deleted[k].filter(id => !(ORIG.deleted[k] || []).includes(id)); if (n.length) O.deleted[k] = n; }
  if (JSON.stringify(OVR.styles || {}) !== JSON.stringify(ORIG.styles || {})) O.styles = OVR.styles || {};
  status('Сохраняю на сайт…', true);
  const r = await gh('/contents/online.json', {method:'PUT', body:JSON.stringify({message:'Правки из онлайн-редактора', content:b64(JSON.stringify(O, null, 1)), sha:GH.sha, branch:'main'})});
  if (!r.ok) {
    const why = r.status === 409 ? 'Файл правок изменился с другого устройства — обновите страницу'
      : r.status === 403 || r.status === 404 ? 'GitHub не дал записать: у токена нет права Contents: Read and write на этот репозиторий. Сделайте новый токен с этим правом.'
      : 'Не удалось сохранить (' + r.status + ')';
    status(why, true); alert(why);
    if (r.status === 403 || r.status === 404) { try { localStorage.removeItem('cw_gh_token'); } catch (e) {} }
    return false;
  }
  GH.sha = (await r.json()).content.sha;
  dirty = false; status('Сохранено ✓ На сайте появится примерно через минуту'); return true;
}

// ---------- сохранение и сборка ----------
async function save() {
  if (ONLINE) return onlineSave();
  const r = await fetch('/api/overrides', {method:'POST', headers:OVR_V ? {'X-Ovr-Mtime':OVR_V} : {}, body:JSON.stringify(OVR, null, 1)});
  if (r.status === 409) { const m = 'Файл правок изменился, пока эта вкладка была открыта (другая вкладка редактора, публикация или правка скриптом). Чтобы не затереть чужие правки, сохранение отменено. Скопируйте нужное, обновите страницу (F5) и сделайте правку заново.'; status('Сохранение отменено: файл правок изменился', true); alert(m); return false; }
  if (!r.ok) { status('Не удалось сохранить', true); return false; }
  OVR_V = (await r.text()).trim();
  if (clipsDirty) { const c = await fetch('/api/clips', {method:'POST', body:JSON.stringify(CLIPS)}); if (!c.ok) { status('Не удалось сохранить список видео', true); return false; } clipsDirty = false; }
  dirty = false; status('Сохранено'); return true;
}
$('#bSave').onclick = save;
$('#bPub').onclick = async () => {
  try { const c = await (await fetch('/api/publish-config')).json(); $('#pubRepo').value = c.repo || ''; $('#pubTok').placeholder = c.hasToken ? 'токен сохранён — оставьте пустым' : 'вставьте токен'; } catch (e) {}
  $('#pubDlg').showModal();
};
$('#pubCancel').onclick = () => $('#pubDlg').close();
$('#pubGo').onclick = async () => {
  const b = $('#pubGo'); b.disabled = true;
  await fetch('/api/publish-config', {method:'POST', body:JSON.stringify({repo:$('#pubRepo').value, token:$('#pubTok').value})});
  $('#pubTok').value = '';
  if (!(await save())) { b.disabled = false; return; }
  status('Собираю сайт…', true);
  let r = await fetch('/api/build', {method:'POST'}); let t = await r.text();
  let ok = r.ok;
  if (r.ok) {
    status('Публикую…', true); await fetch('/api/publish', {method:'POST'});
    // ждём окончания, показывая ход загрузки из git (проценты)
    for (;;) {
      await new Promise(res => setTimeout(res, 1500));
      const st = await (await fetch('/api/publish-status')).json();
      const last = st.log.split(/[\r\n]+/).filter(Boolean).pop() || '';
      if (st.running) { status('Публикую… ' + last.slice(0, 90), true); continue; }
      t += '\n' + st.log.replace(/[^\n]*\r(?!\n)/g, ''); ok = st.ok; break;
    }
  }
  $('#pubDlg').close(); $('#logt').textContent = t; $('#log').classList.add('show');
  status(ok ? 'Опубликовано ✓' : 'Ошибка публикации — см. лог', !ok); b.disabled = false;
  // публикация перенесла правки из онлайн-редактора в overrides.json — берём их, иначе следующее сохранение их затрёт
  if (t.includes('Перенёс онлайн-правки')) { alert('Публикация забрала правки, сделанные онлайн. Редактор перезагрузится, чтобы их показать.'); location.reload(); }
};
$('#bUndo').onclick = undoAll; $('#bRedo').onclick = redoAll;
$('#bBuild').onclick = async () => {
  if (ONLINE) return save();
  const b = $('#bBuild'); b.disabled = true;
  if (!(await save())) { b.disabled = false; return; }
  status('Собираю сайт…', true);
  const r = await fetch('/api/build', {method:'POST'}); const t = await r.text();
  $('#logt').textContent = t; $('#log').classList.add('show');
  status(r.ok ? 'Сайт собран ✓' : 'Ошибка сборки — см. лог', !r.ok);
  if (r.ok) { await loadSite(); NEWIMG = {}; const se = $('#siteEdit'); if (se) { const hh = se.contentWindow.location.hash; se.src = 'index.html?edit=1&e=' + Date.now() + hh; } if (kind !== 'site') { renderList(); if (selId) renderForm(); } }
  b.disabled = false;
};
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
  if ($('#dz-wrap')) return; // в конструкторе своя история
  // в полях ввода Ctrl+Z отменяет набор текста как обычно; вне полей — откатывает правки записей
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !(document.activeElement.closest('#edTree') || document.activeElement.closest('#edp') && document.activeElement.type === 'number');
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && !inField && (k === 'z' || k === 'я')) { e.preventDefault(); e.shiftKey ? redoAll() : undoAll(); }
  if ((e.ctrlKey || e.metaKey) && !inField && (k === 'y' || k === 'н')) { e.preventDefault(); redoAll(); }
});

load();
})();
</script>
